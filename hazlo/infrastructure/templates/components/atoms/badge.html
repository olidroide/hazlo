{# atom: badge — reusable status/confidence/category pill #}
{# Usage: {% include "components/atoms/badge.html" with context %} #}
{# Required: variant (neutral|success|warning|danger|info|purple), text #}
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium
  {% if variant == 'success' %}bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-300
  {% elif variant == 'warning' %}bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-300
  {% elif variant == 'danger' %}bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300
  {% elif variant == 'info' %}bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300
  {% elif variant == 'purple' %}bg-purple-100 text-purple-800 dark:bg-purple-900/30 dark:text-purple-300
  {% else %}bg-neutral-100 text-neutral-800 dark:bg-neutral-700 dark:text-neutral-300{% endif %}"
  {% if title %}title="{{ title }}"{% endif %}
>{{ text }}</span>
